[package]
name = "mide"
version = "0.3.0"
description = "A quiet editor for learning web programming"
edition = "2021"
license = "MIT"

[lib]
name = "mide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
portable-pty = "0.9"
font-kit = "0.14.3"
regex = "1"
notify = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
smoke-test = []
