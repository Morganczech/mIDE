[package]
name = "mide"
version = "0.4.0"
description = "A quiet editor for learning web programming"
edition = "2021"
license = "MIT"

[lib]
name = "mide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
portable-pty = "0.9"
font-kit = "0.14.3"
regex = "1"
notify = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
smoke-test = []

# Temporary, reviewed GTK3 compatibility patches. See vendor/README.md.
[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18.5"

# RUSTSEC-2024-0429 manifests under optimization: keep its regression meaningful.
[profile.test.package.glib]
opt-level = 2
