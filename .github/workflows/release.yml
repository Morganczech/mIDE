name: Release Linux AppImage
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  appimage:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json'));
          const config = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json'));
          const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version = "([^"]+)"/m)?.[1];
          if (process.env.RELEASE_TAG !== `v${pkg.version}` || config.version !== pkg.version || cargo !== pkg.version) {
            throw new Error('Release tag and application versions must match');
          }
          if (!fs.existsSync(`docs/releases/${process.env.RELEASE_TAG}.md`)) {
            throw new Error('Release notes are missing');
          }
          JS
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libfontconfig1-dev libfreetype6-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build x86_64 AppImage
        run: npm run tauri build -- --bundles appimage
      - name: Prepare download and checksum
        run: |
          mkdir release-assets
          cp src-tauri/target/release/bundle/appimage/*.AppImage release-assets/
          cd release-assets
          sha256sum *.AppImage > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-appimage
          path: release-assets/
          if-no-files-found: error
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --title "mIDE $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
